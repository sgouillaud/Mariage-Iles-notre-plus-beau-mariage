<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FBF7F0">
<meta name="robots" content="noindex">
<title>ILESstagram · Cédric &amp; Sébastien</title>
<link rel="icon" href="/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/photos.css">
<link rel="stylesheet" href="/escales.css">
<link rel="stylesheet" href="/ilesstagram.css">
</head>
<body class="ig">
<header class="ig-barre">
  <a class="ig-marque" href="/escales" aria-label="ILESstagram, retour aux escales">
    <img src="/logo.webp" alt="" width="36" height="36">
    <span class="ig-mot"><b>ILES</b>stagram</span>
  </a>
  <div class="ig-outils">
    <button id="vue" class="ig-icone" type="button" aria-label="Afficher en grille" title="Grille / fil">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    </button>
    <a id="tout" class="ig-icone" href="/api/photos.zip" download hidden aria-label="Tout télécharger" title="Tout télécharger (.zip)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0-5-5m5 5 5-5M4 19h16"/></svg>
    </a>
  </div>
</header>

<main class="ig-main">
  <!-- Bulles : passeport + missions -->
  <div id="bulles" class="ig-bulles" hidden></div>

  <section id="passeport" class="passeport" hidden>
    <h2>🛂 Mon passeport Il.e.s</h2>
    <p class="pp-sous">Chaque mission réussie tamponne votre passeport (sur ce téléphone).</p>
    <div id="tampons" class="tampons"></div>
    <p id="pp-compte" class="pp-compte"></p>
  </section>

  <!-- Publier -->
  <form id="envoi" class="ig-publier">
    <div class="ig-pub-ligne">
      <span id="moi" class="ig-avatar" aria-hidden="true">?</span>
      <input id="auteur" maxlength="60" autocomplete="given-name" placeholder="Ton prénom" aria-label="Ton prénom">
    </div>
    <p id="mission-choisie" class="ig-mission-choisie" hidden></p>
    <input id="fichiers" type="file" accept="image/*" multiple class="cache-input">
    <label for="fichiers" class="btn ig-btn">📷 Publier des photos</label>
    <div id="file" class="file" aria-live="polite"></div>
  </form>

  <p id="compte" class="ig-compte"></p>
  <div id="fil" class="ig-fil"></div>
  <div id="grille" class="ig-grille" hidden></div>
  <p id="vide" class="ig-vide">Aucune publication pour l'instant : sois le premier à poster ! 📸</p>
  <p class="retour"><a href="/escales">← Toutes les escales</a> · <a href="/">Le site</a></p>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="/photos.js" defer></script>
</body>
</html>
