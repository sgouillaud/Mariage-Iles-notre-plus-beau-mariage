<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Il.e.s · Playlist</title>
<link rel="icon" href="/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/photos.css">
<link rel="stylesheet" href="/escales.css">
</head>
<body class="page-photos" data-page="playlist">
<header class="ph-head">
  <a href="/escales"><img src="/logo.webp" alt="Il.e.s" width="84" height="84"></a>
  <p class="eyebrow">Ambiance</p>
  <h1>La playlist de la soirée 🎶</h1>
  <p class="sous">Proposez vos titres et votez pour ceux qui doivent passer : la liste ira directement au DJ.</p>
</header>
<main class="ph-wrap">
  <form id="f-titre" class="carte">
    <label class="f" for="p-titre">Titre</label>
    <input id="p-titre" maxlength="100" placeholder="Ex. : Laisse parler les gens" required>
    <label class="f" for="p-artiste">Artiste</label>
    <input id="p-artiste" maxlength="80" placeholder="Ex. : Dry, Jacky Brown…">
    <label class="f" for="p-auteur">Proposé par</label>
    <input id="p-auteur" maxlength="60" autocomplete="given-name" placeholder="Votre prénom">
    <button class="btn" type="submit">Ajouter à la playlist 🎵</button>
  </form>
  <section class="dernieres">
    <h2>Le top des invités</h2>
    <p class="aide">Touchez ❤ pour voter (et retouchez pour retirer votre vote).</p>
    <ol id="titres" class="titres"></ol>
    <p id="vide" class="aide" hidden>Aucun titre pour l’instant : lancez la fête !</p>
  </section>
  <p class="retour"><a href="/escales">← Toutes les escales</a> · <a href="/">Le site</a></p>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="/escales.js" defer></script>
</body>
</html>
