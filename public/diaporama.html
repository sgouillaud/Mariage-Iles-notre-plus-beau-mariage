<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>ILESstagram · en direct</title>
<link rel="icon" href="/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/photos.css">
<link rel="stylesheet" href="/ilesstagram.css">
</head>
<body class="page-insta">
<div id="fond" class="di-fond"></div>
<div class="di-voile"></div>
<div id="scene" class="di-scene">
  <div id="emplacement"></div>
  <aside class="di-cote">
    <img class="di-logo" src="/logo.webp" alt="Il.e.s · Cédric &amp; Sébastien">
    <span class="ig-mot"><b>ILES</b>stagram</span>
    <p class="di-slogan">Like, commente, partage&nbsp;: notre plus beau voyage en direct ✈</p>
    <div class="di-qr">
      <img src="/api/qr-photos.svg" alt="QR code pour publier vos photos" width="200" height="200">
      <p>📸 Publie tes photos ici !</p>
    </div>
    <p id="compteur" class="di-compteur"></p>
  </aside>
</div>
<div id="attente" class="di-attente">
  <span class="ig-mot"><b>ILES</b>stagram</span>
  <p>Scanne le QR code et publie la première photo de la soirée&nbsp;✨</p>
  <div class="di-qr"><img src="/api/qr-photos.svg" alt="QR code pour publier vos photos" width="260" height="260"><p>📸 Publie tes photos ici !</p></div>
</div>
<button id="plein" class="plein" type="button">Plein écran</button>
<script src="/diaporama.js" defer></script>
</body>
</html>
