<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Il.e.s · Cartes postales</title>
<link rel="icon" href="/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/photos.css">
<link rel="stylesheet" href="/escales.css">
</head>
<body class="page-photos" data-page="cartes">
<header class="ph-head">
  <a href="/escales"><img src="/logo.webp" alt="Il.e.s" width="84" height="84"></a>
  <p class="eyebrow">Livre d’or</p>
  <h1>Envoyez-nous une carte postale 💌</h1>
  <p class="sous">Un petit mot, un souvenir, un vœu : choisissez votre timbre et postez.</p>
</header>
<main class="ph-wrap">
  <form id="f-carte" class="carte postale-form">
    <p class="f">Votre timbre</p>
    <div id="timbres" class="timbres" role="radiogroup" aria-label="Choix du timbre"></div>
    <label class="f" for="c-message">Votre message</label>
    <textarea id="c-message" maxlength="600" rows="5" placeholder="Chers Cédric et Sébastien…" required></textarea>
    <label class="f" for="c-auteur">Signé</label>
    <input id="c-auteur" maxlength="60" autocomplete="given-name" placeholder="Votre prénom" required>
    <button class="btn" type="submit">Poster ma carte ✉️</button>
  </form>
  <section class="dernieres">
    <h2>Le mur des cartes postales</h2>
    <div id="mur" class="mur"></div>
    <p id="vide" class="aide" hidden>Aucune carte pour l’instant : soyez le premier !</p>
  </section>
  <p class="retour"><a href="/escales">← Toutes les escales</a> · <a href="/">Le site</a></p>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="/escales.js" defer></script>
</body>
</html>
